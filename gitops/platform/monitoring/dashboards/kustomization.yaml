# Gera um ConfigMap por dashboard; o sidecar do Grafana carrega
# automaticamente ConfigMaps com o label grafana_dashboard=1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-togglemaster-overview
    files:
      - togglemaster-overview.json
