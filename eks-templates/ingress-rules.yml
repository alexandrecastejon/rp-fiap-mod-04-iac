apiVersion: v1
kind: ConfigMap
metadata:
  name: "homepage-html"
  namespace: "eks-namespace"
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Sandbox APIs</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; text-align: center; padding: 10%; margin: 0; }
            .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; max-width: 600px; }
            h1 { color: #0056b3; }
            p { font-size: 1.1em; line-height: 1.6; }
            .status { margin-top: 20px; padding: 10px; background-color: #d4edda; color: #155724; border-radius: 5px; font-weight: bold; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 My Sandbox APIs</h1>
            <p>Bem-vindo ao ambiente de laboratório EKS.</p>
            <p>Todos os microsserviços (Auth, Flags, Targeting, Evaluation e Analytics) estão operacionais e gerenciados via GitOps com ArgoCD.</p>
            <div class="status">✅ Status do Cluster: Operacional</div>
        </div>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "homepage-deployment"
  namespace: "eks-namespace"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        # Variante sem root do nginx (porta 8080), fixada por digest
        image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            memory: "64Mi"
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: html-volume
        configMap:
          name: homepage-html
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi

---
apiVersion: v1
kind: Service
metadata:
  name: "homepage-service"
  namespace: "eks-namespace"
spec:
  selector:
    app: homepage
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "ingress-nginx"
  namespace: "eks-namespace"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
    - hosts:
      - "#{apis_domain}#"
      secretName: apis-tls-cert
  ingressClassName: nginx
  rules:
    - host: "#{apis_domain}#"
      http:
        paths:
          # --- ROTA DO HOMEPAGE SERVICE ---
          - path: /home(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: homepage-service
                port:
                  number: 80
          # --- ROTA DO AUTH SERVICE ---
          - path: /auth(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001

          # --- ROTA DO FLAG SERVICE ---
          - path: /flags(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  number: 8002

          # --- ROTA DO TARGETING SERVICE ---
          - path: /targeting(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: targeting-service
                port:
                  number: 8003
                  
          # --- ROTA DO EVALUATION SERVICE ---
          - path: /evaluation(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: evaluation-service
                port:
                  number: 8004

          # --- ROTA DO ANALYTICS SERVICE ---
          - path: /analytics(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8005
---
# Rotas administrativas do auth-service (criação de chaves, injeção de falha)
# nunca expostas na internet: este Ingress mais específico nega todo acesso
# externo (403). A administração é feita de dentro do cluster (port-forward).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "ingress-nginx-deny-admin"
  namespace: "eks-namespace"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32"
spec:
  tls:
    - hosts:
      - "#{apis_domain}#"
      secretName: apis-tls-cert
  ingressClassName: nginx
  rules:
    - host: "#{apis_domain}#"
      http:
        paths:
          - path: /auth/admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
