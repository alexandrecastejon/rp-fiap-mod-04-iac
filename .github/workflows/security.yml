name: FIAP - MODULO 04 - IAC - SECURITY

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: SECRET SCAN - GITLEAKS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gitleaks - Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 \
            dir /repo --redact --verbose --exit-code 1

  iac-scan:
    name: IAC SCAN - TRIVY CONFIG (TERRAFORM E MANIFESTOS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bloqueia achados HIGH/CRITICAL; exceções aceitas ficam em .trivyignore
      # (com justificativa e data de expiração)
      - name: Trivy - Config Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore'
