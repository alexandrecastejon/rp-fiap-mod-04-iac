version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directories:
      - "/terraform-modules"
      - "/terraform-modules/addons"
      - "/bootstrap"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns: ["*"]
