name: FIAP - MODULO 04 - IAC-ADDONS

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a executar'
        type: choice
        options:
          - apply
          - destroy
        default: apply

# Credenciais AWS via OIDC (token efêmero) - nenhuma access key estática
permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.15.4'
  TF_WORKING_DIR: 'terraform-modules'
  EKS_CLUSTER_NAME: 'eks-cluster-01'
  APP_NAMESPACE: 'eks-namespace'
  INGRESS_NAMESPACE: 'ingress-nginx'

jobs:
  infrastructure:
    name: 'AWS - TERRAFORM - INFRASTRUCTURE'
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: 'APPLY_APPROVAL'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS Credentials - Configure (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          role-session-name: gha-iac-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform - Setup
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform - Init - Infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "================ Terraform - Init ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Initializing Terraform..."
          terraform init \
            -backend-config="bucket=${{ vars.AWS_BUCKET_NAME }}" \
            -backend-config="key=${{ vars.AWS_BUCKET_IAC_FOLDER_NAME }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform - Validate - Infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "============== Terraform - Validate =============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Checking the format..."
          terraform fmt -check -recursive

          echo "##[section]Validating the Infrastructure..."
          terraform validate

      - name: Terraform - Plan - Infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "================ Terraform - Plan ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Planning the Infrastructure..."
          terraform plan -input=false -out=tfplan \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="eks_cluster_name=${{ env.EKS_CLUSTER_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_pass=${{ secrets.DB_PASS }}"

      - name: Terraform - Apply - Infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=============== Terraform - Apply ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Applying the planned Infrastructure..."
          terraform apply -input=false tfplan

  addons:
    name: 'AWS - TERRAFORM - ADDONS'
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS Credentials - Configure (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          role-session-name: gha-addons-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform - Setup
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: EKS Cluster - Setup
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: EKS Cluster - Connect
        run: |
          echo "============= EKS Cluster - Connect =============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Connecting to the EKS Cluster..."
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: EKS Cluster - Namespaces and Secrets
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_SITE: ${{ vars.DATADOG_SITE || 'datadoghq.com' }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          # O pipeline das aplicações só tem acesso ao namespace, então ele é criado aqui
          kubectl create namespace ${{ env.APP_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Segredos da stack de observabilidade (GitOps): GitHub Secrets -> Secrets do Kubernetes
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic datadog -n monitoring \
            --from-literal=api-key="$DD_API_KEY" --from-literal=site="$DD_SITE" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic grafana-admin -n monitoring \
            --from-literal=admin-user=admin --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Terraform - Init - Addons
        working-directory: ${{ env.TF_WORKING_DIR }}/addons
        run: |
          echo "================ Terraform - Init ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Initializing Terraform..."
          terraform init \
            -backend-config="bucket=${{ vars.AWS_BUCKET_NAME }}" \
            -backend-config="key=${{ vars.AWS_BUCKET_ADDONS_FOLDER_NAME }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform - Validate - Addons
        working-directory: ${{ env.TF_WORKING_DIR }}/addons
        run: |
          echo "============== Terraform - Validate =============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Validating the Addons..."
          terraform validate

      - name: Terraform - Plan - Addons
        working-directory: ${{ env.TF_WORKING_DIR }}/addons
        run: |
          echo "================ Terraform - Plan ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Planning the Addons..."
          terraform plan -input=false -out=tfplan \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="aws_bucket_iac_name=${{ vars.AWS_BUCKET_NAME }}" \
            -var="aws_bucket_iac_folder_name=${{ vars.AWS_BUCKET_IAC_FOLDER_NAME }}" \
            -var="eks_cluster_name=${{ env.EKS_CLUSTER_NAME }}" \
            -var="eks_argocd_domain_name=${{ vars.ARGOCD_DOMAIN_NAME }}" \
            -var="eks_grafana_domain_name=${{ vars.GRAFANA_DOMAIN_NAME }}"

      - name: Terraform - Apply - Addons
        working-directory: ${{ env.TF_WORKING_DIR }}/addons
        run: |
          echo "=============== Terraform - Apply ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Applying the planned Addons..."
          terraform apply -input=false tfplan

  configs:
    name: 'AWS - CONFIGS'
    needs: addons
    runs-on: ubuntu-latest
    env:
      EKS_CERT_MANAGER_NAMESPACE: 'cert-manager'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS Credentials - Configure (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          role-session-name: gha-configs-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: EKS Cluster - Setup
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: EKS Cluster - Connect
        run: |
          echo "============= EKS Cluster - Connect =============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Connecting to the EKS Cluster..."
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Ingress Nginx - Apply Rules
        run: |
          echo "================= Ingress Nginx =================="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Applying the Ingress Nginx Rules..."
          kubectl wait --namespace ${{ env.INGRESS_NAMESPACE }} \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s
          sed -i "s|#{apis_domain}#|${{ vars.APIS_DOMAIN_NAME }}|g" eks-templates/ingress-rules.yml
          kubectl apply -f eks-templates/ingress-rules.yml
          sleep 3

          echo "##[section]Validating the Ingress Nginx Services..."
          kubectl get service --namespace ${{ env.INGRESS_NAMESPACE }} ingress-nginx-controller

      - name: Cert-Manager - Apply Rules
        run: |
          echo "================== Cert-Manager =================="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Applying Cert-Manager Rules..."
          kubectl wait --namespace ${{ env.EKS_CERT_MANAGER_NAMESPACE }} \
            --for=condition=Available deployment/cert-manager-webhook \
            --timeout=180s
          sed -i "s|#{letsencrypt_email}#|${{ secrets.LETSENCRYPT_EMAIL }}|g" eks-templates/cert-manager-rules.yml
          kubectl apply -f eks-templates/cert-manager-rules.yml
          sleep 3

          echo "##[section]Validating the Cert-Manager Pods..."
          kubectl get pods --namespace ${{ env.EKS_CERT_MANAGER_NAMESPACE }}

      - name: RBAC - Self-Healing
        run: |
          # Grupo do self-healing só pode reiniciar Deployments no namespace das aplicações
          kubectl apply -f eks-templates/rbac-self-healing.yml

      - name: Route53 - Update
        run: |
          echo "================ Route53 - Update ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Waiting for the NGINX Service to provision the NLB..."
          NLB_DNS=""
          while [ -z "$NLB_DNS" ]; do
            NLB_DNS=$(kubectl get svc ingress-nginx-controller --namespace ${{ env.INGRESS_NAMESPACE }} --output jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -z "$NLB_DNS" ]; then
              echo "##[section]Waiting another 10 seconds..."
              sleep 10
            fi
          done
          echo "##[section]New NLB Detected: $NLB_DNS"

          CHANGES=""
          for HOST in "${{ vars.APIS_DOMAIN_NAME }}" "${{ vars.ARGOCD_DOMAIN_NAME }}" "${{ vars.GRAFANA_DOMAIN_NAME }}"; do
            CHANGES="$CHANGES{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"$HOST\",\"Type\":\"CNAME\",\"TTL\":60,\"ResourceRecords\":[{\"Value\":\"$NLB_DNS\"}]}},"
          done
          echo "{\"Comment\":\"Automatic NLB update via GitHub Actions\",\"Changes\":[${CHANGES%,}]}" > route53-update.json

          echo "##[section]Updating Route53..."
          aws route53 change-resource-record-sets --hosted-zone-id ${{ vars.HOSTED_ZONE_ID }} --change-batch file://route53-update.json

  destroy:
    name: 'AWS - TERRAFORM - DESTROY'
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: 'DESTROY_APPROVAL'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS Credentials - Configure (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          role-session-name: gha-destroy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform - Setup
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: EKS Cluster - Setup
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Load Balancer - Remove Before Destroy
        run: |
          # O NLB é criado pelo Kubernetes (Service do ingress-nginx), não pelo Terraform.
          # Removê-lo antes evita LB órfão cobrando e a VPC presa por ENIs.
          if aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}; then
            kubectl delete svc ingress-nginx-controller -n ${{ env.INGRESS_NAMESPACE }} --ignore-not-found --wait=true --timeout=300s || true
            for i in $(seq 1 30); do
              TAGGED=$(aws resourcegroupstaggingapi get-resources --resource-type-filters elasticloadbalancing:loadbalancer \
                --tag-filters Key=kubernetes.io/cluster/${{ env.EKS_CLUSTER_NAME }} --query "length(ResourceTagMappingList)" --output text)
              [ "$TAGGED" = "0" ] && { echo "Nenhum load balancer do cluster restante"; break; }
              echo "Aguardando remoção de $TAGGED load balancer(s)..."; sleep 10
            done
          else
            echo "Cluster não encontrado; nada a remover"
          fi

      - name: Terraform - Init - Addons
        working-directory: ${{ env.TF_WORKING_DIR }}/addons
        run: |
          echo "================ Terraform - Init ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Initializing Terraform..."
          terraform init \
            -backend-config="bucket=${{ vars.AWS_BUCKET_NAME }}" \
            -backend-config="key=${{ vars.AWS_BUCKET_ADDONS_FOLDER_NAME }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform - Destroy - Addons
        working-directory: ${{ env.TF_WORKING_DIR }}/addons
        run: |
          echo "============== Terraform - Destroy ==============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Destroying the Addons..."
          terraform destroy -auto-approve -input=false \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="aws_bucket_iac_name=${{ vars.AWS_BUCKET_NAME }}" \
            -var="aws_bucket_iac_folder_name=${{ vars.AWS_BUCKET_IAC_FOLDER_NAME }}" \
            -var="eks_cluster_name=${{ env.EKS_CLUSTER_NAME }}" \
            -var="eks_argocd_domain_name=${{ vars.ARGOCD_DOMAIN_NAME }}" \
            -var="eks_grafana_domain_name=${{ vars.GRAFANA_DOMAIN_NAME }}"

      - name: Terraform - Init - Infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "================ Terraform - Init ================"
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Initializing Terraform..."
          terraform init \
            -backend-config="bucket=${{ vars.AWS_BUCKET_NAME }}" \
            -backend-config="key=${{ vars.AWS_BUCKET_IAC_FOLDER_NAME }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform - Destroy - Infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "============== Terraform - Destroy ==============="
          echo "Date/Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------------------"

          echo "##[section]Destroying the Infrastructure..."
          terraform destroy -auto-approve -input=false \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="eks_cluster_name=${{ env.EKS_CLUSTER_NAME }}" \
            -var="db_user=${{ secrets.DB_USER }}" \
            -var="db_pass=${{ secrets.DB_PASS }}"
