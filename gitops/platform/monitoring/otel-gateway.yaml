# OTel Collector "gateway" (Deployment): peça central que recebe OTLP dos
# microsserviços e roteia cada sinal para o backend correto:
#   traces   -> Datadog (APM) + spanmetrics (RED metrics)
#   métricas -> Prometheus (remote write) + Datadog
#   logs     -> Loki (OTLP)
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  # Enriquecimento com metadados do Kubernetes (namespace, deployment, pod)
  kubernetesAttributes:
    enabled: true

# Só OTLP é exposto; Jaeger e Zipkin não são usados
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# API key e site do Datadog vêm do Secret criado pelo pipeline (nunca do Git)
extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog
        key: api-key
  - name: DD_SITE
    valueFrom:
      secretKeyRef:
        name: datadog
        key: site

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
    # Ambiente usado como tag "env" no Datadog
    resource/env:
      attributes:
        - key: deployment.environment.name
          value: fiap-fase4
          action: upsert

  connectors:
    # Calcula as métricas de APM (hits, erros, latência) usadas pelo Datadog
    datadog/connector: {}
    # Gera métricas RED (taxa, erros, duração) a partir dos spans, para o Prometheus
    spanmetrics:
      histogram:
        explicit:
          buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s]
      dimensions:
        - name: http.request.method
        - name: http.response.status_code
        # Convenções semânticas antigas (instrumentação Python)
        - name: http.method
        - name: http.status_code
      metrics_flush_interval: 15s

  exporters:
    datadog:
      api:
        key: ${env:DD_API_KEY}
        site: ${env:DD_SITE}
    prometheusremotewrite:
      endpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    otlphttp/loki:
      endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp

  service:
    extensions:
      - health_check
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource/env, batch]
        exporters: [datadog/connector, datadog, spanmetrics]
      metrics/datadog:
        receivers: [datadog/connector, otlp]
        processors: [memory_limiter, k8sattributes, resource/env, batch]
        exporters: [datadog]
      metrics/prometheus:
        receivers: [spanmetrics, otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource/env, batch]
        exporters: [otlphttp/loki]
